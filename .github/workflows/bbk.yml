name: SelfStorm BBK

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbk
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: BBK-Daten spiegeln
        working-directory: warner
        run: node bbk-sync.mjs

      - name: bbk/ committen
        run: |
          git add -A bbk
          if git diff --cached --quiet; then
            echo "keine Änderung an bbk/"
            exit 0
          fi
          git config user.name "selfstorm-bot"
          git config user.email "bot@selfcoder.de"
          git commit -m "chore(bbk): Daten aktualisiert [skip ci]"
          # Push mit Wiederholung: GitHub lehnt gelegentlich kurz ab
          # ("fatal error in commit_refs") oder ein anderer Bot war schneller.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push fehlgeschlagen (Versuch $i), neuer Versuch in 15 s"
            sleep 15
          done
          exit 1
