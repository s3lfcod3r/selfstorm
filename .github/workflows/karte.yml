name: SelfStorm Karte

on:
  schedule:
    - cron: "23 */6 * * *"   # alle 6 Stunden (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Raster neu vorrechnen
        working-directory: map
        run: node build-grid.mjs

      - name: grid.json committen
        run: |
          if ! git diff --quiet -- map/grid.json; then
            git config user.name "selfstorm-bot"
            git config user.email "bot@selfcoder.de"
            git add map/grid.json
            git commit -m "chore(karte): Raster aktualisiert [skip ci]"
            # Push mit Wiederholung: GitHub lehnt gelegentlich kurz ab
            # ("fatal error in commit_refs") oder ein anderer Bot war schneller.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push fehlgeschlagen (Versuch $i), neuer Versuch in 15 s"
              sleep 15
            done
            exit 1
          else
            echo "keine Änderung am Raster"
          fi
